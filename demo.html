<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="todo-app">
        <h1>To-Do List App</h1>

        <!-- Stats -->
        <div class="stat-container">
            <div class="details">
                <h3>Keep it up!</h3>
                <div id="progressbar">
                    <div id="progress"></div>
                </div>
            </div>
            <div class="stats-number">
                <p id="numbers">0 / 0</p>
            </div>
        </div>

        <!-- Input -->
        <form class="input-area">
            <input type="text" id="task-input" placeholder="Add a new task..." />
            <button type="submit" id="add-task-btn">
                <i class="fa-solid fa-plus"></i>
            </button>
        </form>

        <!-- Tasks -->
        <div class="todos-container">
            <ul id="task-list"></ul>
            <img class="empty-image"
                 src="customer-record-concept-professional-woman-notetaking_1332472-4529.jpg"
                 alt="No tasks">
        </div>
    </div>
</div>

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.1.0/dist/confetti.min.js"></script>

<!-- JS -->
<script src="script.js"></script>
</body>
</html>
